name: Sync to LiberWerk.github.io

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Mirror to LiberWerk.github.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIBERWERKIO_DEPLOY_KEY }}

      - name: Push to LiberWerk.github.io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the target repo
          git clone git@github.com:LiberWerk/LiberWerk.github.io.git /tmp/target

          # Sync all content except .github/workflows (deploy key cannot push workflow files)
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            ./ /tmp/target/

          cd /tmp/target
          git add -A
          git diff --cached --quiet && echo "Nothing to sync" && exit 0
          git commit -m "sync: update from tangoenskai/tangoenskai.github.io [skip ci]"
          git push origin main
