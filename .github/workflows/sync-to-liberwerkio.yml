name: Sync to LiberWerk.github.io

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Mirror to LiberWerk.github.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIBERWERKIO_DEPLOY_KEY }}

      - name: Push to LiberWerk.github.io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add target git@github.com:LiberWerk/LiberWerk.github.io.git
          git push target main --force
